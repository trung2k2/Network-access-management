      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: green;
        -webkit-transition: .4s;
        transition: .4s;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: .4s;
        transition: .4s;
      }

      input:checked + .slider {
        background-color: #f32128;
      }

      input:focus + .slider {
        box-shadow: 0 0 1px #f32128;
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
      }

      /* Rounded sliders */

        border-radius: 34px;

<script> 


var xhttp1 = new XMLHttpRequest(); // Correct variable name
  // AJAX handling for updating temperature and humidity
  var xhttp2 = new XMLHttpRequest(); // Correct variable name

  function fetchSyslog() {
      fetch('/getSyslog')
          .then(response => response.json())
          .then(data => {
            let tbody = document.querySelector('#dataTable2 tbody');
            tbody.innerHTML = '';
            for (let i = data.numRows-1; i >-1; i--) {
              tbody.innerHTML += `
                  <tr>
                      <td>${data.syslog[i].log}</td>    
                  </tr>
              `;
              }
          });

    }

    function fetchArpTable() {
      fetch('/getdataarp')
          .then(response => response.json())
          .then(data => {
            let tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = '';
            for (let i = 0; i < data.numRows; i++) {
              tbody.innerHTML += `
                  <tr>
                      <td>${data.arp[i].device}</td>
                      <td>${data.arp[i].ip_address}</td>
                      <td>${data.arp[i].mac_address}</td>
                      <td style="text-align: center;">${data.arp[i].status}</td>              
                  </tr>
              `;
              }
              let showScan = false;              
              let showHoneypot = false;
              let arpData = data.arp[data.numRows];
              if (arpData.warningscan == "Scan" && Scanstatus) {
                    showScan = true;
                    Scanstatus = false;
                }
                if (arpData.warninghoneypot == "Honeypot-hit" && Honeypotstatus) {
                    showHoneypot = true;
                    Honeypotstatus = false;
                }

              // Gọi hàm hiển thị popup với trạng thái và thông báo tương ứng
              showPopup(showScan, "One device scan network", showHoneypot, "One device connect to honeypot");
          });

    }

    let Honeypotstatus = true;
    let Scanstatus = true;
    function fetchwarning() {
      fetch('/getdataarp')
          .then(response => response.json())
          .then(data => {           
                let showScan = false;              
                let showHoneypot = false;
                let arpData = data.arp[data.numRows];
                if (arpData.warningscan == "Scan" && Scanstatus) {
                      showScan = true;
                      Scanstatus = false;
                  }
                  if (arpData.warninghoneypot == "Honeypot-hit" && Honeypotstatus) {
                      showHoneypot = true;
                      Honeypotstatus = false;
                  }

                // Gọi hàm hiển thị popup với trạng thái và thông báo tương ứng
                showPopup(showScan, "One device scan network", showHoneypot, "One device connect to honeypot");
          });

    }


    function toggleSwitch(switchId) {
        var checkBox = document.getElementById("switch" + switchId);
        var state = checkBox.checked ? 1 : 0; // 1 nếu ON, 0 nếu OFF

        // Gửi yêu cầu POST để cập nhật trạng thái công tắc
        var xhttp2 = new XMLHttpRequest();
        xhttp2.open("POST", "/switch1", true);
        xhttp2.send("id=" + switchId + "status=" + state);
    } 

    // Cập nhật bảng ARP mỗi 20 giây
    window.onload = function() {
        Honeypotstatus = true;
        Scanstatus = true;
        fetchwarning();
        fetchArpTable();
        fetchSyslog();
        setInterval(fetchArpTable, 20000);
        setInterval(fetchwarning, 5000);
        setInterval(fetchSyslog, 100000);
    }; // Cập nhật dữ liệu mỗi 5 giây

    function logout() {
        var xhttp = new XMLHttpRequest();
        xhttp.open("POST", "/login", true);
        xhttp.setRequestHeader("Content-type", "application/x-www-form-urlencoded");
        xhttp.send("action=logout");

        xhttp.onload = function () {
            var response = JSON.parse(this.responseText);
            if (response.success) {
                alert(response.message); // Thông báo người dùng đã đăng xuất
                window.location.href = "/"; // Chuyển hướng đến trang đăng nhập
                
            } else {
                alert("Logout failed!");
            }
        };
        
    }
    

    function showPopup(status1, message1, status2, message2) {
        let showFirstPopup = false;
        let showSecondPopup = false;

        // Kiểm tra trạng thái và cập nhật nội dung popup
        if (status1) {
            const warningDiv1 = document.getElementById("warning1");
            warningDiv1.innerHTML = `<p>${message1}</p>`;
            document.getElementById("popup1").style.display = "block";
            showFirstPopup = true;
        }

        if (status2) {
            setTimeout(() => {
                const warningDiv2 = document.getElementById("warning2");
                warningDiv2.innerHTML = `<p>${message2}</p>`;
                document.getElementById("popup2").style.display = "block";
                showSecondPopup = true;
            }, showFirstPopup ? 500 : 0); // Hiển thị popup 2 sau 500ms nếu popup 1 xuất hiện trước
        }
    }
    function exportPDF() {
        const { jsPDF } = window.jspdf;

        // Data table using autoTable
        doc.autoTable({
            html: '#dataTable',
            startY: 45,
        });
         // Chuyển sang trang 2
         doc.addPage();
         doc.addImage(logoBase64, 'PNG', x, y, width, height);
        doc.setFontSize(18);
        doc.text("REPORT", 105, 20, null, null, "center");

        // Creator's name and date
        doc.setFontSize(8);
        doc.text("Created by: " + creatorName, pageWidth - 65, 30);
        doc.text("Report created: " + new Date().toLocaleString(), pageWidth - 65, 35);

        doc.setFontSize(14);
        doc.text("B. System Log", 10, 40);
        

        // In từng log vào trang 2
        doc.autoTable({
            html: '#dataTable2',
            startY: 45,
        });

        doc.save("Report.pdf");
    }
        
</script>   <!--các chức năng thực hiện trong thẻ này-->

<div class="footer" id="dateTime">
  <!-- Thời gian và múi giờ sẽ được hiển thị ở đây -->
</div>


<script>
  function updateDateTime() {
      const dateTimeElement = document.getElementById('dateTime');
      const now = new Date();
      const options = { 
          year: 'numeric', month: 'long', day: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit', 
          timeZoneName: 'short'
      };
      dateTimeElement.textContent = now.toLocaleString('en-US', options);
  }

  // Cập nhật thời gian ngay khi tải trang
  updateDateTime();


  // Cập nhật mỗi giây
  setInterval(updateDateTime, 1000);
</script>
